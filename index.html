<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍺 Group Beer Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }
    nav {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    nav button {
      flex: 1;
      padding: 12px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    nav button.active {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .counter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
    }
    .btn-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-minus { background: #334155; color: white; }
    .btn-plus { background: #f59e0b; color: black; }
    .count-display { font-size: 48px; font-weight: 900; color: #f59e0b; }
    .hidden { display: none; }
    .member-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }
    .member-row:last-child { border-bottom: none; }
    input[type="text"] {
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 8px 10px;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
      box-sizing: border-box;
    }
    .btn-submit {
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
      margin-top: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- JOIN GROUP SCREEN (Shown if not joined) -->
  <div id="join-screen">
    <div class="card" style="text-align: center;">
      <h2 style="margin-top: 0;">Join Group</h2>
      <div style="margin-bottom: 12px; text-align: left;">
        <label style="color: #94a3b8; font-size: 12px;">YOUR NAME</label>
        <input type="text" id="join-name" placeholder="e.g. Alex">
      </div>
      <div style="margin-bottom: 12px; text-align: left;">
        <label style="color: #94a3b8; font-size: 12px;">GROUP CODE</label>
        <input type="text" id="join-code" placeholder="e.g. BEER2026" style="text-transform: uppercase;">
      </div>
      <button class="btn-submit" onclick="joinGroup()">Join Group</button>
    </div>
  </div>

  <!-- MAIN APP (Shown after joining) -->
  <div id="app-screen" class="hidden">
    <!-- Navigation Bar -->
    <nav>
      <button id="nav-p1" class="active" onclick="switchPage(1)">Tracker</button>
      <button id="nav-p2" onclick="switchPage(2)">Analytics</button>
    </nav>

    <!-- PAGE 1: DAILY LOGGER -->
    <div id="page1">
      <div class="card" style="text-align: center;">
        <h2 style="margin: 0; font-size: 14px; color: #94a3b8;">TODAY'S BEERS (<span id="current-date-label"></span>)</h2>
        <div class="counter">
          <button class="btn-circle btn-minus" onclick="changeCount(-1)">-</button>
          <span id="beer-count" class="count-display">0</span>
          <button class="btn-circle btn-plus" onclick="changeCount(1)">+</button>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-top: 0; font-size: 16px;">Group Info</h3>
        <p style="margin: 4px 0; color: #94a3b8;">Member: <strong id="user-display-name">---</strong></p>
        <p style="margin: 4px 0; color: #94a3b8;">Group Code: <strong id="group-code-label">BEER2026</strong></p>
      </div>
    </div>

    <!-- PAGE 2: REAL ANALYTICS -->
    <div id="page2" class="hidden">
      <div class="card" style="text-align: center;">
        <h3 style="margin: 0; font-size: 14px; color: #94a3b8;">TOTAL GROUP CONSUMPTION</h3>
        <p id="group-total-beers" style="font-size: 36px; font-weight: bold; color: #f59e0b; margin: 8px 0 0 0;">0</p>
      </div>

      <div class="card">
        <h3 style="margin-top: 0; font-size: 16px; color: #94a3b8;">GROUP LEADERBOARD</h3>
        <div id="leaderboard-list">
          <!-- Populated dynamically with all group members -->
        </div>
      </div>
    </div>
  </div>

<script>
    // Config: Replace these with your JSONBin credentials
    const BIN_ID = 'YOUR_BIN_ID'; 
    const API_KEY = 'YOUR_API_KEY'; 

    let userName = localStorage.getItem('beer_username');
    let groupCode = localStorage.getItem('beer_group_code');
    let historyLogs = JSON.parse(localStorage.getItem('beer_history') || '{}');
    const todayDate = new Date().toISOString().split('T')[0];

    window.onload = function() {
      document.getElementById('current-date-label').innerText = todayDate;

      if (userName && groupCode) {
        showApp();
      }
    };

    function joinGroup() {
      const nameInput = document.getElementById('join-name').value.trim();
      const codeInput = document.getElementById('join-code').value.trim().toUpperCase();

      if (!nameInput || !codeInput) return alert('Please enter both your name and group code.');
      if (codeInput !== 'BEER2026') return alert('Invalid group code! Try: BEER2026');

      userName = nameInput;
      groupCode = codeInput;

      localStorage.setItem('beer_username', userName);
      localStorage.setItem('beer_group_code', groupCode);

      showApp();
    }

    function showApp() {
      document.getElementById('join-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('user-display-name').innerText = userName;

      if (historyLogs[todayDate] === undefined) {
        historyLogs[todayDate] = 0;
        localStorage.setItem('beer_history', JSON.stringify(historyLogs));
      }

      updateDisplay();
      syncWithCloud();
    }

    function changeCount(delta) {
      const current = historyLogs[todayDate] || 0;
      historyLogs[todayDate] = Math.max(0, current + delta);
      localStorage.setItem('beer_history', JSON.stringify(historyLogs));

      updateDisplay();
      syncWithCloud();
    }

    function updateDisplay() {
      const todayCount = historyLogs[todayDate] || 0;
      document.getElementById('beer-count').innerText = todayCount;
    }

    // Safely fetch, merge, and save group data
    async function syncWithCloud() {
      if (BIN_ID === 'YOUR_BIN_ID') return; 

      try {
        // 1. GET current cloud data
        const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          method: 'GET',
          headers: { 
            'X-Master-Key': API_KEY,
            'X-Bin-Meta': 'false'
          }
        });

        let binData = await getRes.json();
        
        // Safety check for data structure
        if (!binData || typeof binData !== 'object') binData = {};
        if (!binData.members) binData.members = {};

        // 2. Calculate local total
        let myTotalBeers = 0;
        Object.values(historyLogs).forEach(count => myTotalBeers += count);

        // 3. MERGE: Add/Update ONLY this specific user in the members list
        binData.members[userName] = myTotalBeers;

        // 4. PUT updated object back to JSONBin
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify(binData)
        });

        // 5. Render updated leaderboard containing ALL users
        renderLeaderboard(binData.members);
      } catch (err) {
        console.error('Cloud sync error:', err);
      }
    }

    function renderLeaderboard(membersObj) {
      const leaderboardEl = document.getElementById('leaderboard-list');
      if (!leaderboardEl) return;
      
      leaderboardEl.innerHTML = '';

      let totalGroupBeers = 0;
      const sortedMembers = Object.keys(membersObj).sort((a,b) => membersObj[b] - membersObj[a]);

      if (sortedMembers.length === 0) {
        leaderboardEl.innerHTML = '<div class="member-row" style="color:#94a3b8;">No members found.</div>';
        return;
      }

      sortedMembers.forEach(name => {
        const count = membersObj[name];
        totalGroupBeers += count;

        const row = document.createElement('div');
        row.className = 'member-row';
        row.innerHTML = `<span>${name} ${name === userName ? '(You)' : ''}</span><strong>${count} 🍺</strong>`;
        leaderboardEl.appendChild(row);
      });

      document.getElementById('group-total-beers').innerText = totalGroupBeers + ' 🍺';
    }

    function switchPage(pageNum) {
      const p1 = document.getElementById('page1');
      const p2 = document.getElementById('page2');
      const btn1 = document.getElementById('nav-p1');
      const btn2 = document.getElementById('nav-p2');

      if (pageNum === 1) {
        p1.classList.remove('hidden');
        p2.classList.add('hidden');
        btn1.classList.add('active');
        btn2.classList.remove('active');
      } else {
        p1.classList.add('hidden');
        p2.classList.remove('hidden');
        btn1.classList.remove('active');
        btn2.classList.add('active');
        
        // Fetch fresh group state every time user views Analytics
        syncWithCloud();
      }
    }
  </script>
</body>
</html>
