<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍺 Group Beer Tracker</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }
    nav {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    nav button {
      flex: 1;
      padding: 12px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    nav button.active {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .counter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
    }
    .btn-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-minus { background: #334155; color: white; }
    .btn-plus { background: #f59e0b; color: black; }
    .count-display { font-size: 48px; font-weight: 900; color: #f59e0b; }
    .hidden { display: none; }
    .member-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }
    .member-row:last-child { border-bottom: none; }
    input[type="text"], input[type="email"] {
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 8px 10px;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
      box-sizing: border-box;
    }
    .btn-submit {
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
      margin-top: 8px;
      cursor: pointer;
    }
    .btn-danger {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-remove {
      background: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    .chart-container {
      position: relative;
      height: 220px;
      width: 100%;
      margin-top: 10px;
    }
    .member-badge {
      display: inline-block;
      background: #334155;
      color: #f59e0b;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      margin-right: 6px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- JOIN GROUP SCREEN -->
  <div id="join-screen">
    <div class="card" style="text-align: center;">
      <h2 style="margin-top: 0;">Join CRAZY8 Group</h2>
      <div style="margin-bottom: 12px; text-align: left;">
        <label style="color: #94a3b8; font-size: 12px;">YOUR DISPLAY NAME</label>
        <input type="text" id="join-name" placeholder="e.g. Alex">
      </div>
      <div style="margin-bottom: 12px; text-align: left;">
        <label style="color: #94a3b8; font-size: 12px;">YOUR EMAIL</label>
        <input type="email" id="join-email" placeholder="name@example.com">
      </div>
      <div style="margin-bottom: 12px; text-align: left;">
        <label style="color: #94a3b8; font-size: 12px;">GROUP CODE</label>
        <input type="text" id="join-code" placeholder="CRAZY8" style="text-transform: uppercase;">
      </div>
      <button class="btn-submit" onclick="joinGroup()">Sign Up & Join</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app-screen" class="hidden">
    <nav>
      <button id="nav-p1" class="active" onclick="switchPage(1)">Tracker</button>
      <button id="nav-p2" onclick="switchPage(2)">Analytics</button>
    </nav>

    <!-- PAGE 1: DAILY LOGGER -->
    <div id="page1">
      <div class="card" style="text-align: center;">
        <h2 style="margin: 0; font-size: 14px; color: #94a3b8;">TODAY'S BEERS (<span id="current-date-label"></span>)</h2>
        <div class="counter">
          <button class="btn-circle btn-minus" onclick="changeCount(-1)">-</button>
          <span id="beer-count" class="count-display">0</span>
          <button class="btn-circle btn-plus" onclick="changeCount(1)">+</button>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-top: 0; font-size: 16px;">Group Info</h3>
        <p style="margin: 4px 0; color: #94a3b8;">You: <strong id="user-display-name">---</strong> <span id="host-tag" style="color:#f59e0b; font-size:12px; display:none;">(Host 👑)</span></p>
        <p style="margin: 4px 0; color: #94a3b8;">Email: <strong id="user-display-email" style="font-size:12px; color:#cbd5e1;">---</strong></p>
        <p style="margin: 4px 0 12px 0; color: #94a3b8;">Group Code: <strong id="group-code-label">CRAZY8</strong></p>
        
        <h4 style="margin: 12px 0 6px 0; font-size: 13px; color: #94a3b8;">GROUP MEMBERS</h4>
        <div id="group-members-badges">
          <span class="member-badge">Syncing members...</span>
        </div>
      </div>

      <!-- HOST MANAGEMENT PANEL -->
      <div id="host-panel" class="card hidden">
        <h3 style="margin-top: 0; font-size: 16px; color: #f59e0b;">MANAGE MEMBERS (HOST)</h3>
        <div id="host-member-controls" style="margin-bottom: 12px;"></div>
        <button class="btn-danger" style="width:100%;" onclick="resetEntireGroup()">⚠️ Reset Entire Group Fresh</button>
      </div>
    </div>

    <!-- PAGE 2: ANALYTICS -->
    <div id="page2" class="hidden">
      <div class="card" style="text-align: center;">
        <h3 style="margin: 0; font-size: 14px; color: #94a3b8;">TOTAL GROUP CONSUMPTION</h3>
        <p id="group-total-beers" style="font-size: 36px; font-weight: bold; color: #f59e0b; margin: 8px 0 0 0;">0 🍺</p>
      </div>

      <div class="card">
        <h3 style="margin-top: 0; font-size: 16px; color: #94a3b8;">GROUP LEADERBOARD</h3>
        <div id="leaderboard-list"></div>
      </div>

      <div class="card">
        <h3 style="margin-top: 0; font-size: 16px; color: #94a3b8;">DAILY BEER FREQUENCY</h3>
        <div class="chart-container">
          <canvas id="freqChart"></canvas>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-top: 0; font-size: 16px; color: #94a3b8;">BEERS CONSUMED BY WEEK</h3>
        <div class="chart-container">
          <canvas id="weeklyChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    const BIN_ID = '6a735b28da38895dfebd94ac'; 
    const API_KEY = '$2a$10$jXBaeNimBsDxMlon9ER3YOWeFe3h0F4nrg6SmhMpsWbZq5AoxlGkS'; 
    const HOST_EMAIL = 'matthewswan17@gmail.com';

    let userName = localStorage.getItem('beer_username');
    let userEmail = localStorage.getItem('beer_useremail');
    let groupCode = localStorage.getItem('beer_group_code');
    let historyLogs = JSON.parse(localStorage.getItem('beer_history') || '{}');
    const todayDate = new Date().toISOString().split('T')[0];

    let freqChartInstance = null;
    let weeklyChartInstance = null;
    let isSyncing = false;

    window.onload = function() {
      document.getElementById('current-date-label').innerText = todayDate;
      if (userName && userEmail && groupCode) {
        showApp();
      }
    };

    function joinGroup() {
      const nameInput = document.getElementById('join-name').value.trim();
      const emailInput = document.getElementById('join-email').value.trim().toLowerCase();
      const codeInput = document.getElementById('join-code').value.trim().toUpperCase();

      if (!nameInput || !emailInput || !codeInput) return alert('Please enter your name, email, and group code.');
      if (!emailInput.includes('@') || !emailInput.includes('.')) return alert('Please enter a valid email address.');
      if (codeInput !== 'CRAZY8') return alert('Invalid group code! Try: CRAZY8');

      userName = nameInput;
      userEmail = emailInput;
      groupCode = codeInput;

      localStorage.setItem('beer_username', userName);
      localStorage.setItem('beer_useremail', userEmail);
      localStorage.setItem('beer_group_code', groupCode);

      showApp();
    }

    function showApp() {
      document.getElementById('join-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('user-display-name').innerText = userName;
      document.getElementById('user-display-email').innerText = userEmail;

      if (historyLogs[todayDate] === undefined) {
        historyLogs[todayDate] = 0;
        localStorage.setItem('beer_history', JSON.stringify(historyLogs));
      }

      updateDisplay();
      syncWithCloud();

      setInterval(syncWithCloud, 5000);
    }

    function changeCount(delta) {
      const current = historyLogs[todayDate] || 0;
      historyLogs[todayDate] = Math.max(0, current + delta);
      localStorage.setItem('beer_history', JSON.stringify(historyLogs));

      updateDisplay();
      syncWithCloud();
    }

    function updateDisplay() {
      const todayCount = historyLogs[todayDate] || 0;
      document.getElementById('beer-count').innerText = todayCount;
    }

    async function syncWithCloud() {
      if (!API_KEY || !BIN_ID || isSyncing) return; 
      isSyncing = true;

      try {
        const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          method: 'GET',
          headers: { 
            'X-Master-Key': API_KEY,
            'X-Bin-Meta': 'false'
          }
        });

        let rawRecord = await getRes.json();
        if (!rawRecord || typeof rawRecord !== 'object') rawRecord = {};
        
        let members = rawRecord.members && typeof rawRecord.members === 'object' ? rawRecord.members : {};
        let daily_logs = rawRecord.daily_logs && typeof rawRecord.daily_logs === 'object' ? rawRecord.daily_logs : {};

        // Unique Email Check: If another user registered this email with a different name, prompt user
        if (members[userEmail] && members[userEmail].name !== userName && localStorage.getItem('beer_username_joined')) {
          // Keep synced
        }

        let myTotalBeers = 0;
        Object.values(historyLogs).forEach(count => myTotalBeers += count);

        // Store user profile keyed uniquely by Email
        members[userEmail] = {
          name: userName,
          email: userEmail,
          total: myTotalBeers
        };
        
        daily_logs[userEmail] = historyLogs;

        const payloadToSave = {
          code: "CRAZY8",
          host_email: HOST_EMAIL,
          members: members,
          daily_logs: daily_logs
        };

        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify(payloadToSave)
        });

        renderMemberListBadges(members);
        renderLeaderboard(members);
        renderCharts(daily_logs, members);
        checkHostControls(members);
      } catch (err) {
        console.error('Cloud sync error:', err);
      } finally {
        isSyncing = false;
      }
    }

    function checkHostControls(membersObj) {
      const isHost = (userEmail.toLowerCase() === HOST_EMAIL.toLowerCase());
      const hostPanel = document.getElementById('host-panel');
      const hostTag = document.getElementById('host-tag');

      if (isHost) {
        hostTag.style.display = 'inline';
        hostPanel.classList.remove('hidden');

        const controlsContainer = document.getElementById('host-member-controls');
        controlsContainer.innerHTML = '';

        Object.keys(membersObj).forEach(emailKey => {
          const member = membersObj[emailKey];
          if (emailKey.toLowerCase() !== HOST_EMAIL.toLowerCase()) {
            const row = document.createElement('div');
            row.className = 'member-row';
            row.innerHTML = `
              <div>
                <strong>${member.name}</strong><br>
                <span style="font-size:11px; color:#94a3b8;">${member.email}</span>
              </div>
              <button class="btn-remove" onclick="removeMember('${emailKey}')">Remove</button>
            `;
            controlsContainer.appendChild(row);
          }
        });

        if (controlsContainer.children.length === 0) {
          controlsContainer.innerHTML = '<span style="color:#94a3b8; font-size:12px;">No other members to manage.</span>';
        }
      } else {
        hostTag.style.display = 'none';
        hostPanel.classList.add('hidden');
      }
    }

    async function removeMember(targetEmail) {
      if (!confirm(`Remove member associated with ${targetEmail}?`)) return;

      try {
        const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          method: 'GET',
          headers: { 'X-Master-Key': API_KEY, 'X-Bin-Meta': 'false' }
        });

        let rawRecord = await getRes.json();
        delete rawRecord.members[targetEmail];
        delete rawRecord.daily_logs[targetEmail];

        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
          body: JSON.stringify(rawRecord)
        });

        syncWithCloud();
      } catch (err) {
        console.error('Error removing member:', err);
      }
    }

    async function resetEntireGroup() {
      if (!confirm("Are you sure you want to completely clear all members and start fresh?")) return;

      const freshPayload = {
        code: "CRAZY8",
        host_email: HOST_EMAIL,
        members: {},
        daily_logs: {}
      };

      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
          body: JSON.stringify(freshPayload)
        });

        localStorage.clear();
        alert('Group reset complete!');
        location.reload();
      } catch (err) {
        console.error('Reset error:', err);
      }
    }

    function renderMemberListBadges(membersObj) {
      const container = document.getElementById('group-members-badges');
      if (!container) return;
      container.innerHTML = '';

      Object.keys(membersObj).forEach(emailKey => {
        const member = membersObj[emailKey];
        const badge = document.createElement('span');
        badge.className = 'member-badge';
        badge.innerText = `${member.name}${emailKey.toLowerCase() === userEmail.toLowerCase() ? ' (You)' : ''}${emailKey.toLowerCase() === HOST_EMAIL.toLowerCase() ? ' 👑' : ''}`;
        container.appendChild(badge);
      });
    }

    function renderLeaderboard(membersObj) {
      const leaderboardEl = document.getElementById('leaderboard-list');
      if (!leaderboardEl) return;
      leaderboardEl.innerHTML = '';

      let totalGroupBeers = 0;
      const sortedEmails = Object.keys(membersObj).sort((a,b) => membersObj[b].total - membersObj[a].total);

      sortedEmails.forEach(emailKey => {
        const member = membersObj[emailKey];
        totalGroupBeers += member.total;

        const row = document.createElement('div');
        row.className = 'member-row';
        row.innerHTML = `<span>${member.name} ${emailKey.toLowerCase() === userEmail.toLowerCase() ? '(You)' : ''}${emailKey.toLowerCase() === HOST_EMAIL.toLowerCase() ? ' 👑' : ''}</span><strong>${member.total} 🍺</strong>`;
        leaderboardEl.appendChild(row);
      });

      document.getElementById('group-total-beers').innerText = totalGroupBeers + ' 🍺';
    }

    function renderCharts(allDailyLogs, membersObj) {
      const canvas1 = document.getElementById('freqChart');
      const canvas2 = document.getElementById('weeklyChart');
      if (!canvas1 || !canvas2) return;

      const freqMap = {};
      Object.values(allDailyLogs).forEach(userLogs => {
        if (userLogs && typeof userLogs === 'object') {
          Object.values(userLogs).forEach(count => {
            if (count > 0) {
              freqMap[count] = (freqMap[count] || 0) + 1;
            }
          });
        }
      });

      const sortedAmounts = Object.keys(freqMap).map(Number).sort((a, b) => a - b);
      const freqLabels = sortedAmounts.map(amt => `${amt} Beer${amt > 1 ? 's' : ''}`);
      const freqData = sortedAmounts.map(amt => freqMap[amt]);

      if (freqChartInstance) freqChartInstance.destroy();
      freqChartInstance = new Chart(canvas1.getContext('2d'), {
        type: 'bar',
        data: {
          labels: freqLabels,
          datasets: [{
            label: 'Times Logged',
            data: freqData,
            backgroundColor: '#f59e0b',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
            y: { ticks: { color: '#94a3b8', stepSize: 1, precision: 0 }, grid: { color: '#334155' }, beginAtZero: true }
          }
        }
      });

      const weeklyMap = {};
      Object.values(allDailyLogs).forEach(userLogs => {
        if (userLogs && typeof userLogs === 'object') {
          Object.entries(userLogs).forEach(([dateStr, count]) => {
            if (count > 0) {
              const date = new Date(dateStr);
              const weekNum = Math.ceil(date.getDate() / 7);
              const monthName = date.toLocaleString('default', { month: 'short' });
              const weekKey = `W${weekNum} ${monthName}`;

              weeklyMap[weekKey] = (weeklyMap[weekKey] || 0) + count;
            }
          });
        }
      });

      if (weeklyChartInstance) weeklyChartInstance.destroy();
      weeklyChartInstance = new Chart(canvas2.getContext('2d'), {
        type: 'line',
        data: {
          labels: Object.keys(weeklyMap),
          datasets: [{
            label: 'Group Beers',
            data: Object.values(weeklyMap),
            borderColor: '#f59e0b',
            backgroundColor: 'rgba(245, 158, 11, 0.2)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
            y: { ticks: { color: '#94a3b8', precision: 0 }, grid: { color: '#334155' }, beginAtZero: true }
          }
        }
      });
    }

    function switchPage(pageNum) {
      const p1 = document.getElementById('page1');
      const p2 = document.getElementById('page2');
      const btn1 = document.getElementById('nav-p1');
      const btn2 = document.getElementById('nav-p2');

      if (pageNum === 1) {
        p1.classList.remove('hidden');
        p2.classList.add('hidden');
        btn1.classList.add('active');
        btn2.classList.remove('active');
      } else {
        p1.classList.add('hidden');
        p2.classList.remove('hidden');
        btn1.classList.remove('active');
        btn2.classList.add('active');
        
        syncWithCloud();
      }
    }
  </script>
</body>
</html>
