<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍺 Group Beer Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }
    nav {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    nav button {
      flex: 1;
      padding: 12px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    nav button.active {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .counter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
    }
    .btn-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-minus { background: #334155; color: white; }
    .btn-plus { background: #f59e0b; color: black; }
    .count-display { font-size: 48px; font-weight: 900; color: #f59e0b; }
    .hidden { display: none; }
    .member-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }
    .member-row:last-child { border-bottom: none; }
    input[type="text"] {
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <button id="nav-p1" class="active" onclick="switchPage(1)">Tracker</button>
    <button id="nav-p2" onclick="switchPage(2)">Analytics</button>
  </nav>

  <!-- PAGE 1: DAILY LOGGER -->
  <div id="page1">
    <div class="card" style="text-align: center;">
      <h2 style="margin: 0; font-size: 14px; color: #94a3b8;">TODAY'S BEERS (<span id="current-date-label"></span>)</h2>
      <div class="counter">
        <button class="btn-circle btn-minus" onclick="changeCount(-1)">-</button>
        <span id="beer-count" class="count-display">0</span>
        <button class="btn-circle btn-plus" onclick="changeCount(1)">+</button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top: 0; font-size: 16px;">Profile & Group</h3>
      <div style="margin-bottom: 10px;">
        <label style="color: #94a3b8; font-size: 12px; display: block; margin-bottom: 4px;">YOUR NAME</label>
        <input type="text" id="username-input" value="User" onchange="updateUsername(this.value)" style="width: 100%; box-sizing: border-box;">
      </div>
      <p style="margin: 8px 0 4px 0; color: #94a3b8;">Group: <strong>Founders Club</strong></p>
      <p style="margin: 4px 0; color: #94a3b8;">Code: <strong>BEER2026</strong></p>
    </div>
  </div>

  <!-- PAGE 2: REAL ANALYTICS -->
  <div id="page2" class="hidden">
    <div class="card" style="text-align: center;">
      <h3 style="margin: 0; font-size: 14px; color: #94a3b8;">YOUR ALL-TIME CONSUMPTION</h3>
      <p id="analytics-total" style="font-size: 36px; font-weight: bold; color: #f59e0b; margin: 8px 0 0 0;">0</p>
    </div>

    <div class="card">
      <h3 style="margin-top: 0; font-size: 16px; color: #94a3b8;">THIS MONTH'S TOTAL</h3>
      <div class="member-row">
        <span id="analytics-user-name">User</span>
        <strong id="analytics-month-total">0 🍺</strong>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top: 0; font-size: 16px; color: #94a3b8;">MOST COMMON BEER FREQUENCY</h3>
      <div id="frequency-list">
        <!-- Generated dynamically from actual logs -->
      </div>
    </div>
  </div>

  <script>
    let userName = localStorage.getItem('beer_username') || 'User';
    let historyLogs = JSON.parse(localStorage.getItem('beer_history') || '{}');
    const todayDate = new Date().toISOString().split('T')[0];

    window.onload = function() {
      document.getElementById('username-input').value = userName;
      document.getElementById('current-date-label').innerText = todayDate;

      // Ensure today entry exists in history (defaults to 0 if brand new day)
      if (historyLogs[todayDate] === undefined) {
        historyLogs[todayDate] = 0;
        saveLogs();
      }

      updateDisplay();
    };

    function updateUsername(newName) {
      userName = newName || 'User';
      localStorage.setItem('beer_username', userName);
      updateDisplay();
    }

    function changeCount(delta) {
      const current = historyLogs[todayDate] || 0;
      historyLogs[todayDate] = Math.max(0, current + delta);
      saveLogs();
      updateDisplay();
    }

    function saveLogs() {
      localStorage.setItem('beer_history', JSON.stringify(historyLogs));
    }

    function updateDisplay() {
      const todayCount = historyLogs[todayDate] || 0;
      document.getElementById('beer-count').innerText = todayCount;

      // Calculate All-Time Total
      let totalBeers = 0;
      const currentMonth = todayDate.substring(0, 7); // YYYY-MM
      let monthBeers = 0;
      const frequencyMap = {};

      Object.keys(historyLogs).forEach(date => {
        const count = historyLogs[date];
        totalBeers += count;

        if (date.startsWith(currentMonth)) {
          monthBeers += count;
        }

        // Only count days where beers were consumed for frequency ranking
        if (count > 0) {
          frequencyMap[count] = (frequencyMap[count] || 0) + 1;
        }
      });

      // Update Analytics DOM
      document.getElementById('analytics-total').innerText = totalBeers + " 🍺";
      document.getElementById('analytics-user-name').innerText = userName + " (You)";
      document.getElementById('analytics-month-total').innerText = monthBeers + " 🍺";

      // Render Dynamic Frequency Ranking
      const freqListEl = document.getElementById('frequency-list');
      freqListEl.innerHTML = '';

      const sortedFreqs = Object.keys(frequencyMap).sort((a, b) => frequencyMap[b] - frequencyMap[a]);

      if (sortedFreqs.length === 0) {
        freqListEl.innerHTML = '<div class="member-row" style="color:#94a3b8;">No drinking days recorded yet</div>';
      } else {
        sortedFreqs.forEach(beerAmount => {
          const daysCount = frequencyMap[beerAmount];
          const row = document.createElement('div');
          row.className = 'member-row';
          row.innerHTML = `<span>${beerAmount} beer${beerAmount > 1 ? 's' : ''} in a day</span><strong>${daysCount} day${daysCount > 1 ? 's' : ''}</strong>`;
          freqListEl.appendChild(row);
        });
      }
    }

    function switchPage(pageNum) {
      const p1 = document.getElementById('page1');
      const p2 = document.getElementById('page2');
      const btn1 = document.getElementById('nav-p1');
      const btn2 = document.getElementById('nav-p2');

      if (pageNum === 1) {
        p1.classList.remove('hidden');
        p2.classList.add('hidden');
        btn1.classList.add('active');
        btn2.classList.remove('active');
      } else {
        p1.classList.add('hidden');
        p2.classList.remove('hidden');
        btn1.classList.remove('active');
        btn2.classList.add('active');
      }
    }
  </script>
</body>
</html>
