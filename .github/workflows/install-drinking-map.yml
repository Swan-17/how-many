name: Install drinking map test feature

on:
  push:
    branches:
      - feature/drinking-map-test

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[drinking-map-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test loader into app shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<script src="drinking-map.js"></script>', '<script src="drinking-map-loader.js?v=1"></script>')
          p.write_text(s)
          PY
      - name: Disable service worker in test shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          start = s.find('  <!-- PWA SERVICE WORKER REGISTRATION -->')
          end = s.find('  <script src="drinking-map-loader.js?v=1"></script>')
          if start != -1 and end != -1 and end > start:
              s = s[:start] + '  <!-- Service worker disabled for drinking map test -->\n' + s[end:]
          p.write_text(s)
          PY
      - name: Commit injected app shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use uncached drinking map test loader [drinking-map-injected]"
          git push
