name: Install drinking map test feature

on:
  push:
    branches:
      - feature/drinking-map-test

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[drinking-map-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test loader into app shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          loader = '<script src="drinking-map-loader.js?v=2"></script>'
          if 'drinking-map-loader.js' not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('Could not find </head> in index.html')
              s = s.replace(marker, '  ' + loader + '\n' + marker, 1)
          else:
              import re
              s = re.sub(r'<script src="drinking-map-loader\.js[^>]*></script>', loader, s)
          p.write_text(s)
          PY
      - name: Disable service worker in test shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          start = s.find('  <!-- PWA SERVICE WORKER REGISTRATION -->')
          if start != -1:
              end = s.find('</body>', start)
              if end != -1:
                  block = s[start:end]
                  if 'navigator.serviceWorker' in block:
                      s = s[:start] + '  <!-- Service worker disabled for drinking map test -->\n' + s[end:]
          p.write_text(s)
          PY
      - name: Commit injected app shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Inject drinking map test loader [drinking-map-injected]"
          git push
