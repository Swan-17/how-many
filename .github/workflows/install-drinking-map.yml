name: Install drinking map test feature

on:
  push:
    branches:
      - feature/drinking-map-test

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[drinking-map-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject feature script into app shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<script src="drinking-map.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Could not find </body> in index.html')
              s = s.replace(marker, f'  {tag}\n{marker}', 1)
              p.write_text(s)
          PY
      - name: Commit injected app shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate drinking map test feature [drinking-map-injected]"
          git push
