name: Apply group creation and sharing fix

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()

          old_create_ui = '''<label>GROUP NAME</label><input type="text" id="create-group-name" placeholder="e.g. Friday Drinks">
          <label style="margin-top: 8px; display: block;">UNIQUE CODE</label>
          <input type="text" id="create-group-code" style="text-transform: uppercase;" placeholder="e.g. FRIDAY26">
          <button class="btn-submit" onclick="createGroup()">Create & Become Host</button>'''
          new_create_ui = '''<label>GROUP NAME</label><input type="text" id="create-group-name" placeholder="e.g. Friday Drinks">
          <p style="font-size: 11px; color: var(--text-muted); margin: 8px 0 0;">A unique 5-character join code will be generated automatically.</p>
          <button class="btn-submit" onclick="createGroup()">Create & Become Host</button>'''
          if old_create_ui not in text:
              raise SystemExit('Create-group UI pattern not found')
          text = text.replace(old_create_ui, new_create_ui, 1)

          old_join_ui = '''<label>ENTER UNIQUE GROUP CODE</label>
          <input type="text" id="join-group-code" style="text-transform: uppercase;" placeholder="e.g. 1234">
          <button class="btn-submit" onclick="joinGroup()">Join Group</button>'''
          new_join_ui = '''<label>GROUP NAME</label>
          <input type="text" id="join-group-name" placeholder="e.g. Friday Drinks">
          <label style="margin-top: 8px; display: block;">UNIQUE 5-CHARACTER CODE</label>
          <input type="text" id="join-group-code" maxlength="5" autocomplete="off" style="text-transform: uppercase;" placeholder="e.g. A7K2Q">
          <button class="btn-submit" onclick="joinGroup()">Join Group</button>'''
          if old_join_ui not in text:
              raise SystemExit('Join-group UI pattern not found')
          text = text.replace(old_join_ui, new_join_ui, 1)

          old_create = '''async function createGroup() {
            const name = $('create-group-name').value.trim(), code = $('create-group-code').value.trim().toUpperCase();
            if (!name || !code) return alert('Provide a group name and unique code.');

            const { error } = await sb.from('groups').insert([{ code, name, host_email: userEmail }]);
            if (error) return alert(error.code === '23505' ? 'Group code already taken.' : error.message);

            await sb.from('group_members').upsert([{ group_code: code, user_email: userEmail, user_name: userName }], { onConflict: 'group_code,user_email' });
            $('create-group-name').value = $('create-group-code').value = '';
            closeAllExpandables();
            await fetchUserGroups();
          }'''
          new_create = '''function generateGroupCode(length = 5) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < length; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
          }

          async function createGroup() {
            const name = $('create-group-name').value.trim();
            if (!name) return alert('Enter a group name.');

            let code = null;
            let lastError = null;
            for (let attempt = 0; attempt < 10; attempt++) {
              const candidate = generateGroupCode();
              const { error } = await sb.from('groups').insert([{ code: candidate, name, host_email: userEmail }]);
              if (!error) { code = candidate; break; }
              lastError = error;
              if (error.code !== '23505') break;
            }
            if (!code) return alert(lastError?.message || 'Could not generate a unique group code. Please try again.');

            const { error: memberError } = await sb.from('group_members').upsert(
              [{ group_code: code, user_email: userEmail, user_name: userName }],
              { onConflict: 'group_code,user_email' }
            );
            if (memberError) return alert(memberError.message);

            $('create-group-name').value = '';
            closeAllExpandables();
            await fetchUserGroups();
            alert(`Group created!\\n\\nGroup: ${name}\\nUnique code: ${code}`);
          }'''
          if old_create not in text:
              raise SystemExit('createGroup function pattern not found')
          text = text.replace(old_create, new_create, 1)

          old_join = '''async function joinGroup() {
            const code = $('join-group-code').value.trim().toUpperCase();
            if (!code) return alert('Enter a valid code.');

            const { data: grp } = await sb.from('groups').select('*').eq('code', code).maybeSingle();
            if (!grp) return alert('Group code not found.');

            await sb.from('group_members').upsert([{ group_code: code, user_email: userEmail, user_name: userName }], { onConflict: 'group_code,user_email' });
            $('join-group-code').value = '';
            closeAllExpandables();
            await fetchUserGroups();
          }'''
          new_join = '''async function joinGroup() {
            const name = $('join-group-name').value.trim();
            const code = $('join-group-code').value.trim().toUpperCase();
            if (!name || !code) return alert('Enter the group name and unique 5-character code.');
            if (!/^[A-Z0-9]{5}$/.test(code)) return alert('The group code must be exactly 5 letters and numbers.');

            const { data: grp } = await sb.from('groups').select('*').eq('code', code).maybeSingle();
            if (!grp) return alert('Group code not found.');
            if (grp.name.trim().toLowerCase() !== name.toLowerCase()) return alert('Group name and code do not match.');

            const { error } = await sb.from('group_members').upsert(
              [{ group_code: code, user_email: userEmail, user_name: userName }],
              { onConflict: 'group_code,user_email' }
            );
            if (error) return alert(error.message);

            $('join-group-name').value = '';
            $('join-group-code').value = '';
            closeAllExpandables();
            await fetchUserGroups();
          }'''
          if old_join not in text:
              raise SystemExit('joinGroup function pattern not found')
          text = text.replace(old_join, new_join, 1)

          old_share = '''function shareGroup(e, code) {
            if (e) e.stopPropagation();
            const url = `${window.location.href.split('?')[0]}?join=${code}`;
            if (navigator.share) navigator.share({ title: 'Drink Tracker', text: `Join code: ${code}`, url });
            else navigator.clipboard.writeText(url).then(() => alert(`Link copied to clipboard!\\nCode: ${code}`));
          }'''
          new_share = '''async function shareGroup(e, code) {
            if (e) e.stopPropagation();
            const group = userJoinedGroups.find(g => g.code === code);
            const groupName = group?.name || 'Group';
            const joinCode = String(code || '').toUpperCase();
            const url = `${window.location.href.split('?')[0]}?join=${encodeURIComponent(joinCode)}`;
            const shareText = `Join my How Many Beers group!\\n\\nGroup: ${groupName}\\nUnique code: ${joinCode}\\n\\n${url}`;

            if (navigator.share) {
              try {
                await navigator.share({ title: `How Many Beers - ${groupName}`, text: shareText, url });
              } catch (err) {
                if (err?.name !== 'AbortError') console.error('Share failed:', err);
              }
              return;
            }

            try {
              await navigator.clipboard.writeText(shareText);
              alert(`Group invite copied to clipboard!\\n\\nGroup: ${groupName}\\nUnique code: ${joinCode}`);
            } catch (err) {
              prompt('Copy this group invite:', shareText);
            }
          }'''
          if old_share not in text:
              raise SystemExit('shareGroup function pattern not found')
          text = text.replace(old_share, new_share, 1)

          path.write_text(text)
          print('Updated index.html successfully')

      - name: Commit and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b fix/group-creation-sharing
          git add index.html .github/workflows/apply-group-fix.yml
          git commit -m "Fix group creation codes and sharing"
          git push --set-upstream origin fix/group-creation-sharing
          gh pr create --base main --head fix/group-creation-sharing --title "Fix group creation codes and sharing" --body "Fixes group creation/join validation and updates active-group sharing to include the app link, group name, and 5-character unique code."
