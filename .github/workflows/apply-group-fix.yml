name: Fix group creation and sharing

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch group functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace("groups(name, host_email)", "groups(name, host_email, join_code)", 1)

          s = re.sub(
              r"userJoinedGroups = data \? data\.map\(d => \(\{.*?\}\)\) : \[\];",
              "userJoinedGroups = data ? data.map(d => ({ code: d.group_code, name: d.groups?.name || d.group_code, host_email: (d.groups?.host_email || '').toLowerCase().trim(), join_code: (d.groups?.join_code || '').toUpperCase() })) : [];",
              s, count=1, flags=re.S)

          def between(s, start_marker, end_marker, replacement):
              a = s.find(start_marker)
              if a < 0: raise RuntimeError(f'Not found: {start_marker}')
              b = s.find(end_marker, a + len(start_marker))
              if b < 0: raise RuntimeError(f'Not found: {end_marker}')
              return s[:a] + replacement + s[b:]

          create = '''    async function createGroup() {
      const name = $('create-group-name').value.trim();
      if (!name) return alert('Enter a group name.');
      const { data, error } = await sb.rpc('create_group_secure', { p_name: name });
      if (error) return alert(error.message || 'Could not create the group.');
      const joinCode = String(data?.join_code || data?.password || '').toUpperCase();
      if (!joinCode) return alert('The group was created, but no unique join code was returned. Apply the Supabase group join-code migration.');
      $('create-group-name').value = '';
      closeAllExpandables();
      await fetchUserGroups();
      alert(`Group created!\\n\\nGroup: ${name}\\nUnique code: ${joinCode}`);
    }

'''
          s = between(s, '    async function createGroup() {', '    async function joinGroup() {', create)

          join = '''    async function joinGroup() {
      const name = $('join-group-name').value.trim();
      const code = $('join-group-code').value.trim().toUpperCase();
      if (!name || !code) return alert('Enter the group name and unique 5-character code.');
      if (!/^[A-Z0-9]{5}$/.test(code)) return alert('The group code must be exactly 5 letters and numbers.');
      const { error } = await sb.rpc('join_group_secure', { p_group_name: name, p_password: code });
      if (error) return alert(error.message || 'Could not join the group.');
      $('join-group-name').value = '';
      $('join-group-code').value = '';
      closeAllExpandables();
      await fetchUserGroups();
    }

'''
          s = between(s, '    async function joinGroup() {', '    async function leaveGroup(', join)

          share_start = s.find('    function shareGroup(')
          if share_start < 0: share_start = s.find('    async function shareGroup(')
          if share_start < 0: raise RuntimeError('shareGroup not found')
          depth = 0
          share_end = None
          for i in range(share_start, len(s)):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      share_end = i + 1
                      break
          if share_end is None: raise RuntimeError('shareGroup end not found')
          share = '''    async function shareGroup(e, code) {
      if (e) e.stopPropagation();
      const group = userJoinedGroups.find(g => g.code === code);
      const groupName = group?.name || 'Group';
      const joinCode = String(group?.join_code || code || '').toUpperCase();
      const url = `${window.location.href.split('?')[0]}?join=${encodeURIComponent(joinCode)}`;
      const shareText = `Join my How Many Beers group!\\n\\nGroup name: ${groupName}\\nUnique code: ${joinCode}\\n\\n${url}`;
      if (navigator.share) {
        try { await navigator.share({ title: `How Many Beers - ${groupName}`, text: shareText, url }); }
        catch (err) { if (err?.name !== 'AbortError') console.error('Share failed:', err); }
        return;
      }
      try { await navigator.clipboard.writeText(shareText); alert(`Group invite copied!\\n\\nGroup name: ${groupName}\\nUnique code: ${joinCode}`); }
      catch (err) { prompt('Copy this group invite:', shareText); }
    }'''
          s = s[:share_start] + share + s[share_end:]

          s = s.replace('GROUP CODE: </span><strong style="color: var(--primary-color); font-size: 13px;">${code}</strong>', 'UNIQUE JOIN CODE: </span><strong style="color: var(--primary-color); font-size: 13px; letter-spacing: 1px;">${grp?.join_code || \'Unavailable\'}</strong>', 1)
          s = s.replace('GROUP CODE: </span><strong style="color: var(--primary-color); font-size: 14px;">${code}</strong>', 'UNIQUE JOIN CODE: </span><strong style="color: var(--primary-color); font-size: 14px; letter-spacing: 1px;">${grp?.join_code || \'Unavailable\'}</strong>', 1)

          required = ["sb.rpc('create_group_secure'", "sb.rpc('join_group_secure'", 'join_code', 'navigator.share', 'Group name:', 'Unique code:']
          missing = [x for x in required if x not in s]
          if missing: raise RuntimeError('Missing: ' + ', '.join(missing))
          if "sb.from('groups').insert" in s: raise RuntimeError('Direct groups insert remains')
          if "sb.from('group_members').upsert" in s: raise RuntimeError('Direct group member upsert remains')

          p.write_text(s, encoding='utf-8')
          print('Group flow patch validated successfully')
          PY

      - name: Commit app fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix secure group creation and sharing"
          git push
