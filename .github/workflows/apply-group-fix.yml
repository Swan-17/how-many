name: Fix group creation and sharing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[group-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch group flows
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()

          # Keep the join-code in the user's active-group model.
          text = text.replace(
              "groups(name, host_email)",
              "groups(name, host_email, join_code)",
              1,
          )
          text = re.sub(
              r"userJoinedGroups = data \? data\.map\(d => \(\{ code: d\.group_code, name: d\.groups\?\.name \|\| d\.group_code, host_email: \(d\.groups\?\.host_email \|\| ''\)\.toLowerCase\(\)\.trim\(\)\s*\}\)\) : \[\];",
              "userJoinedGroups = data ? data.map(d => ({ code: d.group_code, name: d.groups?.name || d.group_code, host_email: (d.groups?.host_email || '').toLowerCase().trim(), join_code: (d.groups?.join_code || '').toUpperCase() })) : [];",
              text,
              count=1,
          )

          create_replacement = '''async function createGroup() {
      const name = $('create-group-name').value.trim();
      if (!name) return alert('Enter a group name.');

      const { data, error } = await sb.rpc('create_group_secure', { p_name: name });
      if (error) return alert(error.message || 'Could not create the group.');

      const joinCode = String(data?.join_code || data?.password || '').toUpperCase();
      if (!joinCode) return alert('The group was created, but no unique join code was returned. Apply the Supabase group join-code migration.');

      $('create-group-name').value = '';
      closeAllExpandables();
      await fetchUserGroups();
      alert(`Group created!\\n\\nGroup: ${name}\\nUnique code: ${joinCode}`);
    }'''
          text, count = re.subn(
              r"async function createGroup\(\)\s*\{.*?\n\s*\}\s*(?=async function joinGroup\(\))",
              create_replacement + "\n\n    ",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('createGroup function not found')

          join_replacement = '''async function joinGroup() {
      const name = $('join-group-name').value.trim();
      const code = $('join-group-code').value.trim().toUpperCase();
      if (!name || !code) return alert('Enter the group name and unique 5-character code.');
      if (!/^[A-Z0-9]{5}$/.test(code)) return alert('The group code must be exactly 5 letters and numbers.');

      const { error } = await sb.rpc('join_group_secure', { p_group_name: name, p_password: code });
      if (error) return alert(error.message || 'Could not join the group.');

      $('join-group-name').value = '';
      $('join-group-code').value = '';
      closeAllExpandables();
      await fetchUserGroups();
    }'''
          text, count = re.subn(
              r"async function joinGroup\(\)\s*\{.*?\n\s*\}\s*(?=async function leaveGroup\b)",
              join_replacement + "\n\n    ",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('joinGroup function not found')

          # Share the app link, group name, and the unique join code.
          share_replacement = '''async function shareGroup(e, code) {
      if (e) e.stopPropagation();
      const group = userJoinedGroups.find(g => g.code === code);
      const groupName = group?.name || 'Group';
      const joinCode = String(group?.join_code || code || '').toUpperCase();
      const url = `${window.location.href.split('?')[0]}?join=${encodeURIComponent(joinCode)}`;
      const shareText = `Join my How Many Beers group!\\n\\nGroup name: ${groupName}\\nUnique code: ${joinCode}\\n\\n${url}`;

      if (navigator.share) {
        try {
          await navigator.share({ title: `How Many Beers - ${groupName}`, text: shareText, url });
        } catch (err) {
          if (err?.name !== 'AbortError') console.error('Share failed:', err);
        }
        return;
      }

      try {
        await navigator.clipboard.writeText(shareText);
        alert(`Group invite copied!\\n\\nGroup name: ${groupName}\\nUnique code: ${joinCode}`);
      } catch (err) {
        prompt('Copy this group invite:', shareText);
      }
    }'''
          text, count = re.subn(
              r"(?:async )?function shareGroup\(e, code\)\s*\{.*?\n\s*\}",
              share_replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('shareGroup function not found')

          # Show the unique join code wherever the active-group panel displays the old code.
          text = text.replace('GROUP CODE: </span><strong style="color: var(--primary-color); font-size: 13px;">${code}</strong>', 'UNIQUE JOIN CODE: </span><strong style="color: var(--primary-color); font-size: 13px; letter-spacing: 1px;">${grp?.join_code || \'Unavailable\'}</strong>', 1)
          text = text.replace('GROUP CODE: </span><strong style="color: var(--primary-color); font-size: 14px;">${code}</strong>', 'UNIQUE JOIN CODE: </span><strong style="color: var(--primary-color); font-size: 14px; letter-spacing: 1px;">${grp?.join_code || \'Unavailable\'}</strong>', 1)

          path.write_text(text)

      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix secure group creation and sharing [group-fix]"
          git push
