name: Fix group creation and sharing

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          echo '' | base64 -d >/tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit app fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix secure group creation and sharing [group-fix]"
          git push
