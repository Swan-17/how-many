name: Fix group creation and sharing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[group-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch group flows
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()

          old = "const { data } = await sb.from('group_members').select('group_code, groups(name, host_email)').eq('user_email', userEmail);"
          new = "const { data } = await sb.from('group_members').select('group_code, groups(name, host_email, join_code)').eq('user_email', userEmail);"
          if old not in text: raise SystemExit('fetchUserGroups query pattern not found')
          text = text.replace(old, new, 1)

          old = "userJoinedGroups = data ? data.map(d => ({ code: d.group_code, name: d.groups?.name || d.group_code, host_email: (d.groups?.host_email || '').toLowerCase().trim() })) : [];"
          new = "userJoinedGroups = data ? data.map(d => ({ code: d.group_code, name: d.groups?.name || d.group_code, host_email: (d.groups?.host_email || '').toLowerCase().trim(), join_code: (d.groups?.join_code || '').toUpperCase() })) : [];"
          if old not in text: raise SystemExit('userJoinedGroups mapping pattern not found')
          text = text.replace(old, new, 1)

          create_pattern = re.compile(r"async function createGroup\(\) \{.*?\n    \}\n\n    async function joinGroup\(\)", re.S)
          create_replacement = '''async function createGroup() {
      const name = $('create-group-name').value.trim();
      if (!name) return alert('Enter a group name.');

      const { data, error } = await sb.rpc('create_group_secure', { p_name: name });
      if (error) return alert(error.message || 'Could not create the group.');

      const joinCode = String(data?.join_code || data?.password || '').toUpperCase();
      if (!joinCode) return alert('The group was created, but no join code was returned. Please check the Supabase group join-code migration.');

      $('create-group-name').value = '';
      closeAllExpandables();
      await fetchUserGroups();
      alert(`Group created!\\n\\nGroup: ${name}\\nUnique code: ${joinCode}`);
    }

    async function joinGroup()'''
          text, count = create_pattern.subn(create_replacement, text, count=1)
          if count != 1: raise SystemExit('createGroup function pattern not found')

          join_pattern = re.compile(r"async function joinGroup\(\) \{.*?\n    \}\n\n    async function leaveGroup", re.S)
          join_replacement = '''async function joinGroup() {
      const name = $('join-group-name').value.trim();
      const code = $('join-group-code').value.trim().toUpperCase();
      if (!name || !code) return alert('Enter the group name and unique 5-character code.');
      if (!/^[A-Z0-9]{5}$/.test(code)) return alert('The group code must be exactly 5 letters and numbers.');

      const { error } = await sb.rpc('join_group_secure', { p_group_name: name, p_password: code });
      if (error) return alert(error.message || 'Could not join the group.');

      $('join-group-name').value = '';
      $('join-group-code').value = '';
      closeAllExpandables();
      await fetchUserGroups();
    }

    async function leaveGroup'''
          text, count = join_pattern.subn(join_replacement, text, count=1)
          if count != 1: raise SystemExit('joinGroup function pattern not found')

          old = "const joinCode = String(code || '').toUpperCase();"
          new = "const joinCode = String(group?.join_code || code || '').toUpperCase();"
          if old not in text: raise SystemExit('shareGroup join-code pattern not found')
          text = text.replace(old, new, 1)

          old = '<div style="margin-bottom: 8px;"><span style="color: var(--text-muted); font-size: 11px;">GROUP CODE: </span><strong style="color: var(--primary-color); font-size: 13px;">${code}</strong></div>'
          new = '<div style="margin-bottom: 8px;"><span style="color: var(--text-muted); font-size: 11px;">UNIQUE JOIN CODE: </span><strong style="color: var(--primary-color); font-size: 13px; letter-spacing: 1px;">${grp?.join_code || \'Unavailable\'}</strong></div>'
          if old not in text: raise SystemExit('host join-code display pattern not found')
          text = text.replace(old, new, 1)

          old = 'panel.innerHTML = `<h4 style="margin: 0 0 8px 0; font-size: 13px; color: var(--primary-color);">GROUP INFO</h4><div><span style="color: var(--text-muted); font-size: 12px;">GROUP CODE: </span><strong style="color: var(--primary-color); font-size: 14px;">${code}</strong></div>`;'
          new = 'panel.innerHTML = `<h4 style="margin: 0 0 8px 0; font-size: 13px; color: var(--primary-color);">GROUP INFO</h4><div><span style="color: var(--text-muted); font-size: 12px;">UNIQUE JOIN CODE: </span><strong style="color: var(--primary-color); font-size: 14px; letter-spacing: 1px;">${grp?.join_code || \'Unavailable\'}</strong></div>`;'
          if old not in text: raise SystemExit('member join-code display pattern not found')
          text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix group creation join codes and sharing [group-fix]"
          git push
